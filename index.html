<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>I feel like dinner tonight</title>
    <meta name="theme-color" content="#eef3ec" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // apply a saved dark theme before first paint
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {
        /* storage off */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>I feel like dinner tonight</h1>
        <div class="weeknav">
          <button class="arrow" id="prevWk" aria-label="Previous week">‹</button>
          <div class="wl"><strong id="wkLabel">This week</strong><span id="sub"></span></div>
          <button class="arrow" id="nextWk" aria-label="Next week">›</button>
        </div>
        <nav role="tablist">
          <button role="tab" id="t-week" aria-selected="true" data-tab="week">Week</button>
          <button role="tab" id="t-meals" aria-selected="false" data-tab="meals">Meals</button>
          <button role="tab" id="t-shop" aria-selected="false" data-tab="shop">
            Shopping<span class="count" id="shopCount" hidden></span>
          </button>
        </nav>
      </header>

      <section id="week" role="tabpanel" aria-labelledby="t-week">
        <div id="days"></div>
        <div class="actions">
          <button class="btn" id="spinBtn">Spin the wheel</button>
          <button class="btn danger" id="clearWk">Clear week</button>
        </div>
      </section>

      <section id="meals" role="tabpanel" aria-labelledby="t-meals" hidden>
        <div class="bar">
          <input
            class="search"
            id="mealQ"
            type="search"
            placeholder="Search meals or ingredients"
            aria-label="Search meals or ingredients"
            autocomplete="off"
          />
          <button class="btn" id="addMeal">Add a meal</button>
        </div>
        <div id="mealList"></div>
      </section>

      <section id="shop" role="tabpanel" aria-labelledby="t-shop" hidden>
        <div id="shopList"></div>
        <div class="add">
          <input id="extraIn" placeholder="Add something else" aria-label="Add an extra item" />
          <button class="plus" id="extraAdd" aria-label="Add to the list"></button>
        </div>
        <div class="actions">
          <button class="btn quiet" id="aisleMode">Edit aisles</button>
        </div>
      </section>
      <footer class="foot">
        <div class="footrow">
          <button class="profile" id="acctBtn" hidden>
            <span class="avatar" id="whoPic" aria-hidden="true"></span>
            <span class="who"
              ><strong id="whoName">Guest</strong><small id="whoSub">Sign in to sync and share</small></span
            >
          </button>
          <button class="btn" id="listsBtn" hidden>My lists</button>
          <button class="cog" id="settingsBtn" aria-label="Settings">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
          </button>
        </div>
        <p class="sync"><span id="sync"></span></p>
      </footer>
    </div>

    <dialog id="pickDlg">
      <div class="dlg">
        <h2 id="pickTitle">Monday</h2>
        <input
          class="search"
          id="pickQ"
          type="search"
          placeholder="Search meals or ingredients"
          aria-label="Search meals or ingredients"
          autocomplete="off"
        />
        <div class="pick" id="pickList"></div>
        <div class="pick acts" id="pickActs"></div>
        <div class="row">
          <div class="r"><button class="btn ghost" data-close>Cancel</button></div>
        </div>
      </div>
    </dialog>

    <dialog id="spinDlg">
      <div class="dlg spin">
        <div class="spinhead">
          <h2 id="spinTitle">Friday</h2>
          <span class="step" id="spinStep"></span>
        </div>
        <div class="tagbox" id="spinTagbox">
          <span class="tags" id="spinTags"></span>
          <input
            id="spinQ"
            type="text"
            placeholder="Narrow it down by ingredient"
            aria-label="Narrow the wheel by ingredient"
            autocomplete="off"
          />
        </div>
        <div class="reel" id="spinReel" aria-live="polite" tabindex="-1" autofocus>
          <div class="win" aria-hidden="true"></div>
          <div class="strip" id="spinStrip"></div>
        </div>
        <div class="r">
          <button class="btn" id="spinKeep">Keep it</button>
          <button class="btn ghost" id="spinAgain">Spin again</button>
        </div>
        <div class="r ends">
          <button class="btn quiet" id="spinSkip">Skip this night</button>
          <button class="btn quiet" data-close>Stop</button>
        </div>
      </div>
    </dialog>

    <dialog id="listsDlg">
      <div class="dlg">
        <h2>Your lists</h2>
        <div class="lists" id="listsBody" tabindex="-1" autofocus></div>
        <div class="r"><button class="btn ghost" data-close>Close</button></div>
      </div>
    </dialog>

    <dialog id="settingsDlg">
      <div class="dlg">
        <h2>Settings</h2>
        <div class="lists" tabindex="-1" autofocus>
          <h3>Theme</h3>
          <div class="seg" id="themeSeg">
            <button type="button" data-theme="light" aria-pressed="true">
              <span class="ico" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="4" />
                  <path
                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                  /></svg></span
              >Light
            </button>
            <button type="button" data-theme="dark" aria-pressed="false">
              <span class="ico" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg></span
              >Dark
            </button>
          </div>
        </div>
        <div class="r"><button class="btn ghost" data-close>Close</button></div>
      </div>
    </dialog>

    <dialog id="acctDlg">
      <div class="dlg">
        <h2>Account</h2>
        <div class="lists" id="acctBody" tabindex="-1" autofocus></div>
        <div class="r"><button class="btn ghost" data-close>Close</button></div>
      </div>
    </dialog>

    <dialog id="mealDlg">
      <form class="dlg" method="dialog" id="mealForm">
        <h2 id="mealTitle">Add a meal</h2>
        <label class="f">Name<input id="mName" required autocomplete="off" /></label>
        <label class="f"
          >Ingredients<span>One per line. Start a line with “maybe” if it’s optional.</span
          ><textarea id="mIng" rows="7"></textarea>
        </label>
        <label class="f"
          >Notes<span>Method, tips, whatever helps.</span
          ><textarea id="mNotes" rows="3" style="min-height: 4.5em"></textarea>
        </label>
        <div class="row" id="mEditActs">
          <button type="button" class="btn danger" id="mDel">Delete meal</button>
          <div class="r">
            <button type="button" class="btn ghost" data-close>Cancel</button
            ><button type="submit" class="btn">Save meal</button>
          </div>
        </div>
        <div class="row" id="mViewActs" hidden>
          <button type="button" class="btn" id="mChange">Change dinner</button>
          <div class="r">
            <button type="button" class="btn ghost" id="mEdit">Edit meal</button
            ><button type="button" class="btn ghost" data-close>Close</button>
          </div>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
