<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>I feel like dinner tonight</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef3ec" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // before first paint: a saved theme
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.dataset.theme = "dark";
      } catch {
        /* storage off */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="weeknav">
          <button class="arrow" id="prevWk" aria-label="Previous week"></button>
          <button class="wl" id="wkNow" disabled>
            <strong id="wkLabel">This week</strong><span id="sub"></span
            ><span class="back" id="wkBack">Back to this week</span>
          </button>
          <button class="arrow" id="nextWk" aria-label="Next week"></button>
        </div>
      </header>

      <section id="week" role="tabpanel" aria-labelledby="t-week">
        <div id="days"></div>
        <div class="actions">
          <button class="btn" id="spinBtn">Spin the wheel</button>
          <div class="more">
            <button
              class="iconbtn"
              id="weekMore"
              aria-label="More for this week"
              aria-haspopup="menu"
              aria-expanded="false"
            ></button>
            <div class="menu" id="weekMenu" role="menu" hidden>
              <button role="menuitem" class="danger" id="clearWk">Clear week</button>
            </div>
          </div>
        </div>
      </section>

      <section id="meals" role="tabpanel" aria-labelledby="t-meals" hidden>
        <div class="bar">
          <input
            class="search"
            id="mealQ"
            type="search"
            placeholder="Search meals"
            aria-label="Search meals or ingredients"
            autocomplete="off"
          />
          <button class="btn" id="addMeal">Add a meal</button>
        </div>
        <div id="mealList"></div>
      </section>

      <section id="shop" role="tabpanel" aria-labelledby="t-shop" hidden>
        <div class="shopbar">
          <p id="shopSummary"></p>
          <button class="btn quiet" id="aisleMode">Edit aisles</button>
        </div>
        <div id="shopList"></div>
        <div class="add">
          <input id="extraIn" placeholder="Add something else" aria-label="Add an extra item" />
          <button class="plus" id="extraAdd" aria-label="Add to the list"></button>
        </div>
        <div id="shopDone"></div>
      </section>
      <section id="profile" class="lists" role="tabpanel" aria-labelledby="t-profile" hidden>
        <div class="lists" id="acctBody"></div>
        <h3>Theme</h3>
        <div class="seg" id="themeSeg">
          <button type="button" data-theme="system" aria-pressed="false">System</button>
          <button type="button" data-theme="light" aria-pressed="true">Light</button>
          <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
        </div>
      </section>
      <p class="sync"><span id="sync"></span></p>
    </div>

    <nav class="tabbar" role="tablist" aria-label="Sections">
      <button role="tab" id="t-week" aria-selected="true" data-tab="week"><span class="lbl">Week</span></button>
      <button role="tab" id="t-meals" aria-selected="false" data-tab="meals"><span class="lbl">Meals</span></button>
      <button role="tab" id="t-shop" aria-selected="false" data-tab="shop">
        <span class="lbl">Shopping</span><span class="count" id="shopCount" hidden></span>
      </button>
      <button role="tab" id="t-profile" aria-selected="false" data-tab="profile">
        <span class="avatar" id="acctBtn"></span><span class="lbl">Profile</span>
      </button>
    </nav>

    <dialog id="pickDlg" class="sheet">
      <div class="sheet-head">
        <span class="grab"></span>
        <h2 id="pickTitle">Monday</h2>
      </div>
      <div class="sheet-fixed">
        <div class="chips" id="pickChips"></div>
        <input
          class="search"
          id="pickQ"
          type="search"
          placeholder="Search meals or ingredients"
          aria-label="Search meals or ingredients"
          autocomplete="off"
        />
      </div>
      <div class="sheet-body">
        <div class="pick" id="pickList"></div>
      </div>
      <div class="sheet-foot">
        <button class="btn ghost" data-close>Close</button>
        <button class="btn" id="pickNew">New meal</button>
      </div>
    </dialog>

    <dialog id="viewDlg" class="sheet">
      <div class="sheet-head">
        <span class="grab"></span>
        <h2 id="viewTitle"></h2>
        <p class="sheet-sub" id="viewSub"></p>
      </div>
      <div class="sheet-body" id="viewBody" tabindex="-1" autofocus></div>
      <div class="sheet-foot">
        <button class="btn ghost" data-close>Close</button>
        <div class="r">
          <button class="btn ghost" id="vEdit">Edit</button>
          <button class="btn" id="vChange">Change dinner</button>
        </div>
      </div>
    </dialog>

    <dialog id="spinDlg" class="sheet">
      <div class="sheet-head">
        <span class="grab"></span>
        <h2 id="spinTitle">Friday</h2>
        <p class="sheet-sub" id="spinStep"></p>
      </div>
      <div class="sheet-body spin">
        <p class="muted" id="spinFills"></p>
        <div class="tagbox" id="spinTagbox">
          <span class="tags" id="spinTags"></span>
          <input
            id="spinQ"
            type="text"
            placeholder="Filter by ingredient"
            aria-label="Filter the wheel by ingredient"
            autocomplete="off"
          />
        </div>
        <div class="reel" id="spinReel" aria-live="polite" tabindex="-1" autofocus>
          <div class="win" aria-hidden="true"></div>
          <div class="strip" id="spinStrip"></div>
        </div>
        <p class="muted" id="spinWhy" hidden></p>
        <div class="r">
          <button class="btn respin" id="spinAgain">
            <svg
              class="ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 12a8 8 0 1 1-2.6-5.9" />
              <path d="M20 4v5h-5" />
            </svg>
            Re-spin
          </button>
          <button class="btn quiet" id="spinSkip">Skip</button>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn stop" data-close>Stop</button>
        <button class="btn" id="spinKeep">Keep it</button>
      </div>
    </dialog>

    <dialog id="mealDlg" class="sheet" data-keep>
      <form method="dialog" id="mealForm">
        <div class="sheet-head">
          <span class="grab"></span>
          <h2 id="mealTitle">Add a meal</h2>
        </div>
        <div class="sheet-body">
          <label class="f">Name<input id="mName" required autocomplete="off" /></label>
          <label class="f"
            >Ingredients<span class="hint">One per line. Start a line with “maybe” if it’s optional.</span
            ><textarea id="mIng" rows="6" placeholder="e.g. chicken thigh&#10;rice&#10;maybe coriander"></textarea>
          </label>
          <label class="f"
            >Notes<span class="hint">Method or tips (optional)</span
            ><textarea id="mNotes" rows="3" placeholder="e.g. 200°C for 25 minutes. Good with rice."></textarea>
          </label>
          <button type="button" class="btn danger" id="mDel">Delete meal</button>
        </div>
        <div class="sheet-foot">
          <button type="button" class="btn ghost" data-close>Cancel</button>
          <button type="submit" class="btn">Save meal</button>
        </div>
      </form>
    </dialog>

    <dialog id="aisleDlg" class="sheet">
      <div class="sheet-head">
        <span class="grab"></span>
        <h2 id="aisleTitle">Move</h2>
        <p class="sheet-sub">Choose an aisle. It is remembered for this ingredient.</p>
      </div>
      <div class="sheet-body">
        <div class="pick" id="aisleList" tabindex="-1" autofocus></div>
      </div>
      <div class="sheet-foot">
        <button class="btn ghost" data-close>Cancel</button>
      </div>
    </dialog>

    <dialog id="confirmDlg" class="sheet">
      <div class="sheet-head">
        <span class="grab"></span>
        <h2 id="confirmTitle"></h2>
      </div>
      <div class="sheet-body">
        <p class="muted" id="confirmMsg" tabindex="-1" autofocus></p>
      </div>
      <div class="sheet-foot">
        <button class="btn ghost" data-close>Cancel</button>
        <button class="btn danger solid" id="confirmOk"></button>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
