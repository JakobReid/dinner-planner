<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I feel like dinner tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>I feel like dinner tonight</h1>
    <div class="weeknav">
      <button class="arrow" id="prevWk" aria-label="Previous week">‹</button>
      <div class="wl"><strong id="wkLabel">This week</strong><span id="sub"></span></div>
      <button class="arrow" id="nextWk" aria-label="Next week">›</button>
    </div>
    <nav role="tablist">
      <button role="tab" id="t-week" aria-selected="true" data-tab="week">Week</button>
      <button role="tab" id="t-meals" aria-selected="false" data-tab="meals">Meals</button>
      <button role="tab" id="t-shop" aria-selected="false" data-tab="shop">Shopping<span class="count" id="shopCount" hidden></span></button>
    </nav>
  </header>

  <section id="week" role="tabpanel" aria-labelledby="t-week">
    <div id="days"></div>
    <div class="actions">
      <button class="btn big" id="fill">Fill empty nights</button>
      <button class="btn ghost" id="toShop">See shopping list</button>
      <button class="btn danger" id="clearWk">Clear this week</button>
    </div>
  </section>

  <section id="meals" role="tabpanel" aria-labelledby="t-meals" hidden>
    <div class="actions" style="margin:0 0 14px"><button class="btn" id="addMeal">Add a meal</button></div>
    <div id="mealList"></div>
  </section>

  <section id="shop" role="tabpanel" aria-labelledby="t-shop" hidden>
    <div id="shopList"></div>
    <div class="add">
      <input id="extraIn" placeholder="Add something else (milk, bin bags…)" aria-label="Add an extra item">
      <button class="btn" id="extraAdd">Add</button>
    </div>
    <div class="actions"><button class="btn ghost" id="untick">Untick everything</button></div>
  </section>
  <p class="sync"><span id="sync"></span> <button class="linkbtn" id="shareBtn" hidden>Copy share link</button></p>
</div>

<dialog id="pickDlg">
  <div class="dlg">
    <h2 id="pickTitle">Monday</h2>
    <input class="search" id="pickQ" type="search" placeholder="Search meals or ingredients (rice, mince…)" aria-label="Search meals or ingredients" autocomplete="off">
    <div class="pick" id="pickList"></div>
    <div class="pick acts" id="pickActs"></div>
    <div class="row"><div class="r"><button class="btn ghost" data-close>Cancel</button></div></div>
  </div>
</dialog>

<dialog id="mealDlg">
  <form class="dlg" method="dialog" id="mealForm">
    <h2 id="mealTitle">Add a meal</h2>
    <label class="f">Name<input id="mName" required autocomplete="off"></label>
    <label class="f">Ingredients<span>One per line. Start a line with “maybe” if it’s optional.</span><textarea id="mIng" rows="7"></textarea></label>
    <label class="f">Notes<span>Method, tips, whatever helps.</span><textarea id="mNotes" rows="3" style="min-height:4.5em"></textarea></label>
    <div class="row">
      <button type="button" class="btn danger" id="mDel">Delete meal</button>
      <div class="r"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn">Save meal</button></div>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="aisles.js"></script>
<script src="app.js"></script>
</body>
</html>
